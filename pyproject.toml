[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opdi"
version = "2.0.0"
description = "Open Performance Data Initiative - Aviation data processing pipeline"
readme = "readme.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "EUROCONTROL", email = "pru-support@eurocontrol.int"}
]
keywords = [
    "aviation", "ads-b", "opensky", "data-pipeline", "pyspark",
    "air-traffic", "h3", "geospatial", "iceberg", "etl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Operating System :: OS Independent",
]

dependencies = [
    "pyspark>=3.5.1",
    # v4 specifically: the code calls polygon_to_cells, LatLngPoly,
    # latlng_to_cell, grid_distance and cell_to_latlng, none of which exist in
    # v3. Left open at >=3.7.0, the driver resolved 4.5.0 while the executor
    # image pinned <4, and the two ran different APIs for weeks.
    "h3>=4,<5",
    # Not used by the pipeline itself (it has its own H3 functions), but
    # imported by study scripts under benchmarks/ and tests/, and installed in
    # the executor image.
    "h3-pyspark>=1.0.0",
    "shapely>=2.0.0",
    # Imported by the reference step 00b (airport layouts); osmnx needs it too.
    "geopandas>=0.12.0",
    "pyproj>=3.4.0",
    "osmnx>=1.2.0",
    "pandas>=1.5.0",
    "pyarrow>=10.0.0",
    "numpy>=1.23.0",
    "python-dateutil>=2.8.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-spark>=0.6.0",
    "black>=22.0.0",
    "mypy>=0.990",
    "ruff>=0.1.0",
    "duckdb>=1.0.0",
    "sqlglot>=25.0.0",
]
# Airflow, only on the machine that runs the scheduler (airflow/dags/).
airflow = [
    "apache-airflow==2.7.2",
]
# Building the airport layouts (reference step 00b) from a local
# OpenStreetMap extract (opdi.reference.pbf_source, pbf_filter).
reference = [
    "osmium>=3.6.0",
]
# Reading the published files (opdi.published). The reader never starts
# Spark or Java, but PySpark is a dependency of the package itself, so it is
# installed as well.
reader = [
    "pyarrow>=10.0.0",
    "duckdb>=1.0.0",
    "pandas>=1.5.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-autodoc-typehints>=1.23.0",
    "furo>=2023.9.0",
]

[project.urls]
Homepage = "https://github.com/euctrl-pru/opdi"
Repository = "https://github.com/euctrl-pru/opdi"
Documentation = "https://github.com/euctrl-pru/opdi/blob/main/README.md"
Issues = "https://github.com/euctrl-pru/opdi/issues"

[project.scripts]
opdi = "opdi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opdi = ["py.typed"]
"opdi.reference" = ["data/*.csv", "data/*.md"]
"opdi.sql" = ["*.sql", "trino/*.sql"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "B", "UP"]
ignore = [
    # The flight-list working columns are upper case (ADEP, ADES, DOF), and
    # the pipeline names its local frames and imports after them.
    "N803",
    "N806",
    "N812",
    # The class docstring documents the constructor's arguments (Google
    # style), so __init__ needs no docstring of its own.
    "D107",
    # The code writes Optional[...], List[...] and typing imports, which
    # Python 3.10 still accepts; rewriting every annotation is a separate
    # change.
    "UP006",
    "UP007",
    "UP035",
    "UP045",
    # zip() without strict=: the code zips sequences of equal length.
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests and study scripts are not documented as an API.
# Tests and study scripts put their own folders on sys.path before importing.
"tests/**" = ["D", "N802", "E402"]
"benchmarks/**" = ["D", "E402"]
# The report's style sheet is one literal string with long CSS rules.
"benchmarks/build_track_v4_paper.py" = ["D", "E402", "E501"]
"tools/**" = ["D"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# src/ first, so that the tests import the code of this checkout rather than
# another installed copy of the package.
pythonpath = ["src", "tests"]
